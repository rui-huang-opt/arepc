[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "arepc"
version = "0.1.0"
license = { text = "MIT" }
description = "A Python package for Byzantine-resilient distributed consensus using the Adaptive Reputation-based Consensus (ARepC) algorithm."
authors = [{ name = "Rui Huang", email = "ruihuang0421@gmail.com" }]

dependencies = [
    "scipy>=1.15.3",
    "conops @ git+https://github.com/rui-huang-opt/conops.git@0.4.3",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6.29.5"]
examples = ["matplotlib>=3.10.3", "networkx>=3.4.2", "ray[default]==2.54.1"]

[tool.setuptools.packages.find]
where = ["src"]
